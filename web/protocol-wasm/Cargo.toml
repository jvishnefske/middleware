[package]
name = "protocol-wasm"
version = "0.1.0"
edition = "2024"
description = "Browser bindings for the middleware serial protocol, loader and payload simulator"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["simulator"]
# In-browser payload simulator: the device runtime (`wasm-host`) compiled to WASM.
simulator = ["dep:wasm-host"]

[dependencies]
# `trust`: the device-side loader checks signed commits like the firmware.
middleware = { path = "../..", features = ["trust"] }
wasm-host = { path = "../../wasm-host", optional = true }
# The board pin rules both firmwares build their profiles on (`pins`).
board-pins = { path = "../../board-pins" }
# State-machine tables: checks and reference dispatch (`machines`).
state-table = { path = "../../state-table" }
# S88 batch control: phase model, recipe checks, allocation, engine (`recipes`).
recipe-core = { path = "../../recipe-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
wat = "1"
