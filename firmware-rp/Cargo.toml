[package]
name = "rp-base"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "RP base firmware (Raspberry Pi Pico / Pico 2): serves the middleware serial protocol over USB CDC-ACM and runs WASM payloads"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: cross-compiled for thumbv6m-none-eabi (RP2040) and
# thumbv8m.main-none-eabihf (RP2350) with a chip feature, so it stays out of
# the parent (host) workspace, like `firmware/`.
[workspace]

[lib]
# The pure core (`rp_base`): flash map, chip profiles, request routing (the
# `sys/fw/*` seam), the request service over any NOR flash, heap budget.
# No RP dependencies; unit tested on the host with `cargo test --lib`.
path = "src/lib.rs"

[[bin]]
name = "rp-base"
path = "src/main.rs"
test = false
bench = false
# The binary needs a chip feature (each enables `shell`); without one, host
# commands such as `cargo clippy --lib --all-targets` skip it.
required-features = ["shell"]

# Host tool: the RP2350 post-link step of build.sh (update and factory
# images, UF2s). `cargo run --features image-tool --bin rp-image`.
[[bin]]
name = "rp-image"
path = "src/bin/rp-image.rs"
test = false
bench = false
required-features = ["image-tool"]

[features]
default = []
# Exactly one chip feature must be enabled to build the binary.
#
# RP2040 (Pico): Cortex-M0+, no CAS atomics. wasmi 2.0 needs CAS atomics
# and `alloc::sync::Arc`, which `thumbv6m-none-eabi` lacks (the same reason
# esp-base builds the ESP32-C3 without `wasm`), so this build has no
# payload runtime: it serves sys/info, the loader, the flash store and
# trust, reports firmware `<ver>+no-wasm` and refuses sys/payload/start.
# `unstable-pac`: the SPI and I2C register drivers (built, not yet used,
# so their register code is checked for this chip too).
rp2040 = ["shell", "embassy-rp/rp2040", "embassy-rp/unstable-pac", "dep:portable-atomic"]
# RP2350 (Pico 2, RP2350A): Cortex-M33, runs payloads, A/B firmware OTA.
# embassy-rp emits no IMAGE_DEF (build.rs generates the image's own, with
# TBYB, version and sentinel) and exposes its PAC (the QMI address
# translation registers and the SPI / I2C controllers, read and written
# without `unsafe`).
rp2350 = ["shell", "wasm", "fw-update", "embassy-rp/rp235xa", "embassy-rp/imagedef-none", "embassy-rp/unstable-pac"]
# The WASM payload runtime (wasm-host / wasmi) and its bounded heap.
wasm = ["dep:wasm-host", "dep:linked_list_allocator"]
# A/B firmware OTA (RP2350 only): `sys/fw/*` served by
# `rp_base::ota::AbUpdate` (middleware::fw_ota on the RP2350's flash and
# boot ROM). Without it `sys/fw/*` is NotFound.
fw-update = []
# Host only: the `rp-image` tool (std, mwctl's image checks).
image-tool = ["dep:mwctl"]
# Internal: the imperative shell's dependencies, pulled in by a chip feature.
shell = [
  "dep:embassy-rp",
  "dep:embassy-executor",
  "dep:embassy-time",
  "dep:embassy-sync",
  "dep:embassy-futures",
  "dep:embassy-usb",
  "dep:static_cell",
  "dep:cortex-m",
  "dep:cortex-m-rt",
  "dep:embedded-io-async",
]

[dependencies]
# The pure core of the ESP base firmware, shared rather than copied:
# request dispatch (`dispatch`), the two-slot payload store (`store`,
# `image`), the trust record (`trust_store`) and the heap check (`start`).
# Default features off (no chip, no esp-hal); `trust` for signed payloads.
esp-base = { path = "../firmware", default-features = false, features = ["trust"] }
# The board pin rules (Pico pin map, RP function tables, SPI routing),
# shared with esp-base and the web editor.
board-pins = { path = "../board-pins" }
middleware = { path = "..", features = ["serial", "trust"] }
heapless = { version = "0.9", default-features = false }
embedded-storage = "0.3.2"

wasm-host = { path = "../wasm-host", optional = true }
# Global allocator for the interpreter (`wasm` only). `init_from_slice`
# takes a `&'static mut` arena, so the heap comes up without `unsafe`.
linked_list_allocator = { version = "0.10.6", optional = true }

embassy-rp = { version = "0.10.0", features = ["time-driver", "critical-section-impl"], optional = true }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"], optional = true }
embassy-time = { version = "0.5.1", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
embassy-usb = { version = "0.6.0", default-features = false, optional = true }
static_cell = { version = "2.1.1", optional = true }
cortex-m = { version = "0.7.7", optional = true }
cortex-m-rt = { version = "0.7.5", optional = true }
embedded-io-async = { version = "0.7", optional = true }
# `rp-image` only (feature `image-tool`, host): mwctl's image loading and
# checks, so the build refuses what `mwctl fw update` would.
mwctl = { path = "../tools/mwctl", optional = true }
# RP2040 only: CAS for static_cell's atomics through critical sections
# (thumbv6m has no CAS instructions).
portable-atomic = { version = "1.11", features = ["critical-section"], optional = true }

[dev-dependencies]
# Host tests sign commits with a test key; the firmware only verifies.
ed25519-dalek = { version = "2.2", default-features = false }
# The heap budget tests compute `Limits::heap_needed` on the host.
wasm-host = { path = "../wasm-host" }
# mwctl runs unchanged against the service over an in-process link.
mwctl = { path = "../tools/mwctl" }
# The request tests decode the phase server's acknowledgements and reports
# with recipe-core's wire contract, and build a trapping payload from WAT.
recipe-core = { path = "../recipe-core" }
wat = "1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
