[package]
name = "mw-payload"
description = "Safe no_std SDK for middleware WASM payloads"
# Spelled out instead of inherited from the payload workspace: cargo loads
# this manifest from the parent workspace too (as mw-jpeg's dev-dependency,
# which payload-sim's R14 test uses), where it cannot inherit.
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["panic-handler"]
# Provide a `#[panic_handler]` that logs the panic location through the
# `log` import and traps. Disable to supply your own.
panic-handler = []

[dependencies]
middleware = { path = "../..", default-features = false }
embedded-hal = "1.0"
