[package]
name = "mw-jpeg"
description = "Incremental no_std baseline JPEG decoder to RGB565 for WASM payloads"
# Spelled out instead of inherited from the payload workspace: the parent
# workspace's payload-sim uses this crate (as a dev-dependency, for the
# R14 reference decode), and a path dependency outside its own workspace
# cannot inherit.
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["half"]
# `Scale::Half` (the reduced 4×4 IDCT, about 1 KB of WASM code). A payload
# that only decodes at full scale (`cam_jpeg_view`) turns default features
# off; `Decoder::start` then refuses `Scale::Half` with
# `Unsupported::Scale`.
half = []

[dependencies]

[dev-dependencies]
# Only the `fuel_probe` example (a wasm32 payload) uses the SDK.
mw-payload = { path = "../sdk" }

# A minimal payload that decodes an embedded frame, one MCU row per tick:
# its size is the decoder's code size, and `payload-sim --fuel F` bisects
# the fuel one call needs (see the crate docs).
[[example]]
name = "fuel_probe"
crate-type = ["cdylib"]
test = false
