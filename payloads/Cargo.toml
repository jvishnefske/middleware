# WASM payload workspace. Kept out of the parent `middleware` workspace
# (see its `exclude`) because everything here except `abi-check` builds for
# `wasm32-unknown-unknown` (set in `.cargo/config.toml`).
[workspace]
resolver = "3"
members = [
    "sdk",
    "examples/blink",
    "examples/echo",
    "examples/button",
    "examples/spi_loopback",
    "examples/uart_echo",
    "examples/dimmer",
    "examples/cam_stream",
    "examples/cam_view",
    "examples/cam_jpeg_stream",
    "examples/cam_jpeg_view",
    "examples/cam_ov2640_stream",
    "examples/bench",
    "gc9a01",
    "jpeg",
    "abi-check",
]
# `cargo build --release` builds only the guests; `abi-check` is a host tool
# run with `--target x86_64-unknown-linux-gnu` (see README.md). `jpeg` is
# left out: built in the same invocation, its default `half` feature would
# be unified into `cam_jpeg_view`, which turns it off (scripts/check-all.sh
# checks mw-jpeg on its own).
default-members = [
    "sdk",
    "examples/blink",
    "examples/echo",
    "examples/button",
    "examples/spi_loopback",
    "examples/uart_echo",
    "examples/dimmer",
    "examples/cam_stream",
    "examples/cam_view",
    "examples/cam_jpeg_stream",
    "examples/cam_jpeg_view",
    "examples/cam_ov2640_stream",
    "examples/bench",
    "gc9a01",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1

# The JPEG decoder's hot loops run under wasmi's fuel metering, which
# charges every Wasm operator: "s" lets LLVM inline the small std helpers
# that "z" leaves as calls, for about 15-30 % less fuel per MCU and a
# slightly smaller binary (measured with jpeg/examples/fuel_probe.rs).
[profile.release.package.mw-jpeg]
opt-level = "s"

# cam_jpeg_view's own code at "s" too: measured with payload-sim on the
# fixture stream, 12 % less fuel per frame (13.2 M against 15.1 M) and
# 84 bytes less code than "z", which leaves `copy_from_slice` and similar
# helpers out of line. A package override drops the profile's `strip`, so
# it is repeated (otherwise the name section adds about 3 KB).
[profile.release.package.cam_jpeg_view]
opt-level = "s"
strip = true

# The benchmark's workloads at the opt-level cam_jpeg_view uses, so its
# fuel per step matches the viewer's code.
[profile.release.package.bench]
opt-level = "s"
strip = true
