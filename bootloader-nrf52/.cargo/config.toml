[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# Flashed over the micro:bit's CMSIS-DAP probe (SWD). Not run from here: the
# bootloader is written with `probe-rs` by the provisioning recipe only.
runner = "probe-rs run --chip nRF52833_xxAA"
rustflags = ["-C", "link-arg=-Tlink.x"]
