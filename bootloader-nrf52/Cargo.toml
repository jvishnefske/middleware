[package]
name = "bootloader-nrf52"
version = "26.11.21"
edition = "2021"
description = "micro:bit v2 (nRF52833) bootloader: jumps to the app at 0x4000, or serves a framed image over the VCOM UART to reflash it"
publish = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1"
sha2 = { version = "0.10.9", default-features = false }

[profile.release]
debug = 2
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[workspace]
