[package]
name = "middleware"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Transport-agnostic pub/sub and request/response middleware over Zenoh, gRPC (Istio mesh) and BLE"
license = "MIT OR Apache-2.0"

# Standalone workspace, kept out of the enclosing `katas` package.
# `firmware/` (per-chip ESP32 targets), `firmware-esp8266/` (the ESP8266
# protocol-only firmware) and `payloads/` (wasm32 guests) are separate
# workspaces because they build for other targets and toolchains.
#
# The root package is a member without being listed: listing "." would
# make every path under the root an explicit member and defeat `exclude`
# for `posix-node`'s path dependency on `firmware/` (esp-base's pure core).
[workspace]
members = ["service", "gateway", "robot", "posix-node", "board-pins", "state-table", "recipe-core", "wasm-host", "wasm-hdl-ref", "tools/payload-sim", "tools/mwctl", "tools/jpeg-fixtures", "web/protocol-wasm"]
exclude = ["firmware", "firmware-esp8266", "firmware-rp", "payloads"]

[features]
default = []
# Host-only conveniences. Never enabled by the microcontroller features.
std = []

# Durable key-value store on the local filesystem (`kv::file::FileKv`):
# an append-only log with CRC-checked records. Host only.
kv-file = ["std"]

# Codecs
postcard = ["dep:postcard", "dep:serde"]
prost = ["dep:prost"]

# Embedded transports (no_std, no heap)
ble = []
serial = ["dep:embedded-io-async"]
espnow = []
# The board's Zenoh 1.x client (`zenoh_lite`): a pure codec and session
# state machine and an async adapter over one `embedded-io-async` TCP
# stream. no_std, no heap; the `zenoh` crates need alloc and getrandom.
zenoh-lite = ["dep:embedded-io-async"]
# Signed payload updates (no_std, no heap): SHA-256 of the image while it
# streams in, Ed25519 and ECDSA P-256 verification of signed commits, and
# the pure trust state transitions. The wire types are always built; this
# adds the crypto.
trust = ["dep:sha2", "dep:ed25519-dalek", "dep:p256"]
# The in-memory RP2350 bootrom and flash model (`fw_ota::sim`) for host
# tests of A/B firmware updates (here and in mwctl's fake device). Host only.
fw-sim = ["std", "trust"]
# The fake JPEG camera's baked frames (`stream::frames::fixtures`, about
# 53 KB of `include_bytes!` data from `fixtures/cam`), served by
# `SourceKind::TestPattern` for JPEG configs. no_std, no heap.
cam-fixtures = []

# Cloud / host transports (std, tokio)
zenoh = ["std", "dep:zenoh", "dep:tokio"]
grpc = ["std", "dep:tonic", "dep:tokio", "dep:tokio-stream", "dep:http", "dep:bytes", "tokio?/net", "tokio-stream?/sync"]
istio = ["grpc"]
mdns = ["std", "dep:tokio", "tokio?/net", "dep:socket2"]
# Unicast DNS-SD (RFC 6763 over ordinary DNS: SRV/TXT/A/AAAA lookups and
# browsing through a resolver), `dns::unicast`. Host only, like `mdns`.
dns-sd = ["std", "dep:tokio", "tokio?/net", "dep:getrandom"]
# The in-process backend `transport::memory` for tests and examples (host
# only: std and tokio's timers). Integration tests enable it through the
# self dev-dependency below.
memory = ["std", "dep:tokio"]
# The host UDP transport `udp::UdpTransport` (one raw serial frame per
# datagram, port 7448): std and tokio's sockets and timers. The framing in
# `udp` itself is always built (no_std).
udp = ["std", "dep:tokio", "tokio?/net"]

[dependencies]
# Bounded owned strings and byte vectors (no heap) for the discovery
# directory's records.
heapless = { version = "0.9", default-features = false }
postcard = { version = "1.1", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
prost = { version = "0.14", default-features = false, features = ["derive"], optional = true }
embedded-io-async = { version = "0.7", optional = true }
# `compress` exposes the SHA-256 block function: the loader keeps its own
# Copy-able hashing state around it (see loader/sha256.rs).
sha2 = { version = "0.10.9", default-features = false, features = ["compress"], optional = true }
# Verification only: no signing, no precomputed tables, no std.
ed25519-dalek = { version = "2.2", default-features = false, optional = true }
# ECDSA P-256 / SHA-256 for keys held in hardware tokens (TPM 2.0, PIV):
# no std, no alloc; the linker drops the signing half the firmware never calls.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }

zenoh = { version = "1.10", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
# Query ids for unicast DNS-SD (`dns-sd`), from the OS CSPRNG.
getrandom = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
tonic = { version = "0.14", optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
# The mDNS announcer binds port 5353 with SO_REUSEADDR / SO_REUSEPORT so it
# can share it with a system mDNS daemon (tokio cannot set them before bind).
socket2 = { version = "0.6", features = ["all"], optional = true }

[dev-dependencies]
# The crate itself with `memory`, so `tests/` (the conformance harness) can
# use the in-process backend under a plain `cargo test`.
middleware = { path = ".", features = ["memory"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }
# The S88 phase command contract on these traits (`tests/recipe_wire.rs`).
recipe-core = { path = "recipe-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
# `zenoh_lite`'s codec is checked byte for byte against Zenoh's own
# (ZN1), pinned to the `zenoh` version in Cargo.lock. Host tests only.
zenoh-codec = "=1.10.1"
zenoh-protocol = "=1.10.1"
zenoh-buffers = "=1.10.1"

# One service kind discovered over Zenoh, mDNS and cluster DNS (stub on
# loopback), then called with request_with and Gather over Zenoh and the
# gRPC mesh client. `test = true`: `cargo test --all-features` runs it (K16).
[[example]]
name = "zenoh_board"
required-features = ["zenoh", "trust"]

[[example]]
name = "discover_and_call"
required-features = ["zenoh", "grpc", "istio", "dns-sd", "mdns"]
test = true
