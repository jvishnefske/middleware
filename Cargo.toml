[package]
name = "middleware"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Transport-agnostic pub/sub and request/response middleware over Zenoh, gRPC (Istio mesh) and BLE"
license = "MIT OR Apache-2.0"

# Standalone workspace, kept out of the enclosing `katas` package.
# `firmware/` (per-chip ESP32 targets), `firmware-esp8266/` (the ESP8266
# protocol-only firmware) and `payloads/` (wasm32 guests) are separate
# workspaces because they build for other targets and toolchains.
[workspace]
members = [".", "wasm-host", "tools/payload-sim", "tools/mwctl", "web/protocol-wasm"]
exclude = ["firmware", "firmware-esp8266", "payloads"]

[features]
default = []
# Host-only conveniences. Never enabled by the microcontroller features.
std = []

# Codecs
postcard = ["dep:postcard", "dep:serde"]
prost = ["dep:prost"]

# Embedded transports (no_std, no heap)
ble = []
serial = ["dep:embedded-io-async"]
espnow = []
# Signed payload updates (no_std, no heap): SHA-256 of the image while it
# streams in, Ed25519 verification of signed commits, and the pure trust
# state transitions. The wire types are always built; this adds the crypto.
trust = ["dep:sha2", "dep:ed25519-dalek"]

# Cloud / host transports (std, tokio)
zenoh = ["std", "dep:zenoh", "dep:tokio"]
grpc = ["std", "dep:tonic", "dep:tokio", "dep:tokio-stream", "dep:http", "dep:bytes", "tokio?/net", "tokio-stream?/sync"]
istio = ["grpc"]

[dependencies]
postcard = { version = "1.1", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
prost = { version = "0.14", default-features = false, features = ["derive"], optional = true }
embedded-io-async = { version = "0.7", optional = true }
# `compress` exposes the SHA-256 block function: the loader keeps its own
# Copy-able hashing state around it (see loader/sha256.rs).
sha2 = { version = "0.10.9", default-features = false, features = ["compress"], optional = true }
# Verification only: no signing, no precomputed tables, no std.
ed25519-dalek = { version = "2.2", default-features = false, optional = true }

zenoh = { version = "1.10", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
tonic = { version = "0.14", optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
