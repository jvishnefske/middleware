apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenohd
  namespace: apps
  labels:
    app.kubernetes.io/name: zenohd
    app.kubernetes.io/part-of: mw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zenohd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zenohd
        app.kubernetes.io/part-of: mw
        sidecar.istio.io/inject: 'true'
      annotations:
        mw.infra.local/config-hash: 9f0374070905a11b
    spec:
      serviceAccountName: zenohd
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: zenohd
        image: localhost/mw/zenohd
        imagePullPolicy: Never
        args:
        - -c
        - /etc/zenoh/config.json5
        env:
        - name: RUST_LOG
          value: info
        ports:
        - name: zenoh
          containerPort: 7447
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: zenoh
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: zenoh
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/zenoh/config.json5
          subPath: config.json5
          readOnly: true
        - name: auth
          mountPath: /etc/zenoh/auth
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: zenohd-config
      - name: auth
        secret:
          secretName: zenohd-auth
          defaultMode: 288
          items:
          - key: dictionary
            path: dictionary
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zenohd
  namespace: apps
  labels:
    app.kubernetes.io/name: zenohd
    app.kubernetes.io/part-of: mw
spec:
  selector:
    app.kubernetes.io/name: zenohd
  ports:
  - name: zenoh
    port: 7447
    targetPort: zenoh
    protocol: TCP
    appProtocol: tcp
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: zenohd
  namespace: apps
  labels:
    app.kubernetes.io/name: zenohd
    app.kubernetes.io/part-of: mw
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zenohd
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - infra.local/ns/apps/sa/demo-caller
        - infra.local/ns/apps/sa/demo-echo
        - infra.local/ns/apps/sa/mw-gateway
        - infra.local/ns/istio-ingress/sa/istio-ingressgateway
        - infra.local/robot/*
    to:
    - operation:
        ports:
        - '7447'
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: zenohd-robots
  namespace: apps
  labels:
    app.kubernetes.io/name: zenohd
    app.kubernetes.io/part-of: mw
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 15443
      name: tls-zenoh
      protocol: TLS
    tls:
      mode: ISTIO_MUTUAL
    hosts:
    - apps/zenoh.infra.local
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: zenohd-robots
  namespace: apps
  labels:
    app.kubernetes.io/name: zenohd
    app.kubernetes.io/part-of: mw
spec:
  hosts:
  - zenoh.infra.local
  gateways:
  - apps/zenohd-robots
  tcp:
  - match:
    - port: 15443
    route:
    - destination:
        host: zenohd.apps.svc.cluster.local
        port:
          number: 7447
