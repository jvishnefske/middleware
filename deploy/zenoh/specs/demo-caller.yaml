# What `demo-caller --print-spec` declares for Zenoh.
name: demo/caller
serves: []
calls:
- demo/echo
allow_callers: []
publishes: []
subscribes:
- app/demo/**
- app/robot/**
replicas: 1
resources:
  cpu_request: 50
  cpu_limit: 500
  memory_request: 64
  memory_limit: 256
drain_grace_ms: 5000
port: 50051
