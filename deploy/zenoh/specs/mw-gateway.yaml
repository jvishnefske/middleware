# What `mw-gateway --print-spec` declares for Zenoh: device pub/sub
# bridged under app/dev/**.
name: mw/gateway
serves: []
calls: []
allow_callers: []
publishes:
- app/dev/**
subscribes:
- app/dev/**
replicas: 1
resources:
  cpu_request: 50
  cpu_limit: 500
  memory_request: 64
  memory_limit: 256
drain_grace_ms: 5000
port: 50051
