# spiffe-helper (nix/robot.nix): fetch this workload's X509-SVID from the
# local SPIRE agent and keep it on disk, renewed, for the robot's processes.
agent_address = "@agentSocket@"
cert_dir = "@spiffeDir@"
svid_file_name = "svid.pem"
svid_key_file_name = "svid_key.pem"
svid_bundle_file_name = "bundle.pem"
# HCL numbers are decimal: the key 0400 (256), certificates 0644 (420).
key_file_mode = 256
cert_file_mode = 420
daemon_mode = true
