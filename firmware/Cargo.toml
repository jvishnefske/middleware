[package]
name = "esp-base"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "ESP base firmware: serves the middleware serial protocol and runs WASM payloads"
license = "MIT OR Apache-2.0"

# Standalone workspace: builds for Xtensa and RISC-V targets with per-chip
# features, so it stays out of the parent (host) workspace.
[workspace]

[lib]
# The pure core (`esp_base`): request dispatch, image layout, chip tables.
# No ESP dependencies; unit tested on the host with `cargo test --lib`.
path = "src/lib.rs"

[[bin]]
name = "esp-base"
path = "src/main.rs"
test = false
bench = false

[features]
# `trust` is on by default so `cargo test --lib` covers signed payloads; the
# ESP8266 crate depends on this one with default features off.
default = ["trust"]
# Signed payload updates: the dispatcher keeps the pinned key and checks
# signed commits (middleware's `trust`: SHA-256 + Ed25519 verify).
trust = ["middleware/trust"]
# Exactly one chip feature must be enabled to build the binary.
esp32 = [
  "shell",
  "trust",
  "wasm",
  "espnow",
  "esp-radio?/esp32",
  "esp-hal/esp32",
  "esp-rtos/esp32",
  "esp-bootloader-esp-idf/esp32",
  "esp-alloc/esp32",
  "esp-backtrace/esp32",
  "esp-println/esp32",
  "esp-storage/esp32",
]
esp32s3 = [
  "shell",
  "trust",
  "wasm",
  "espnow",
  "esp-radio?/esp32s3",
  "esp-hal/esp32s3",
  "esp-rtos/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
  "esp-alloc/esp32s3",
  "esp-backtrace/esp32s3",
  "esp-println/esp32s3",
  "esp-storage/esp32s3",
]
esp32c3 = [
  "shell",
  "trust",
  "esp-hal/esp32c3",
  "esp-rtos/esp32c3",
  "esp-bootloader-esp-idf/esp32c3",
  "esp-alloc/esp32c3",
  "esp-backtrace/esp32c3",
  "esp-println/esp32c3",
  "esp-storage/esp32c3",
]
# The WASM payload runtime (wasm-host / wasmi). On by default for the
# Xtensa chips. Not enabled for esp32c3: wasmi 2.0 needs CAS atomics and
# `alloc::sync::Arc`, which `riscv32imc-unknown-none-elf` lacks. Without it
# the firmware still serves sys/info, the loader and flash storage, reports
# firmware version `<ver>+no-wasm`, and refuses sys/payload/start.
wasm = ["dep:wasm-host"]
# ESP-NOW transport (esp-radio, Wi-Fi station on a fixed channel) and the
# ABI 4 DMA routes that stream over it. On for the Xtensa chips; it needs the
# payload runtime, so not for esp32c3 (no `wasm` there). Costs heap for the
# Wi-Fi driver (`Profile::radio_heap`).
espnow = ["wasm", "dep:esp-radio", "esp-rtos/esp-radio"]
# Internal: the imperative shell's dependencies, pulled in by a chip feature.
shell = [
  "dep:esp-hal",
  "dep:esp-rtos",
  "dep:esp-bootloader-esp-idf",
  "dep:esp-alloc",
  "dep:esp-backtrace",
  "dep:esp-println",
  "dep:esp-storage",
  "dep:embassy-executor",
  "dep:embassy-time",
  "dep:embassy-sync",
  "dep:embassy-futures",
  "dep:static_cell",
  "dep:critical-section",
  "dep:embedded-io-async",
]

[dependencies]
# `espnow`: the frame format and transport (pure, no heap) for the radio
# shell and the host-tested route core (`esp_base::route`).
middleware = { path = "..", features = ["serial", "espnow"] }
heapless = { version = "0.9", default-features = false }
embedded-storage = "0.3.2"

wasm-host = { path = "../wasm-host", optional = true }

esp-hal = { version = "~1.2.2", features = ["unstable"], optional = true }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc"], optional = true }
esp-bootloader-esp-idf = { version = "0.6.0", optional = true }
esp-alloc = { version = "0.11.0", optional = true }
esp-backtrace = { version = "0.20.0", features = ["panic-handler", "println"], optional = true }
esp-println = { version = "0.18.0", optional = true }
esp-storage = { version = "0.10.0", features = ["embedded-storage"], optional = true }
embassy-executor = { version = "0.10.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }
embassy-sync = { version = "0.7.2", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
static_cell = { version = "2.1.1", optional = true }
critical-section = { version = "1.2.0", optional = true }
embedded-io-async = { version = "0.7", optional = true }
# Wi-Fi driver for ESP-NOW (`espnow` feature). 1.0.0-beta.1 is the release
# built against esp-hal ~1.2 / esp-rtos 0.4 (the conagotchi badge firmware
# uses the same).
esp-radio = { version = "1.0.0-beta.1", default-features = false, features = ["esp-alloc", "esp-now", "unstable"], optional = true }

[dev-dependencies]
# Host tests sign commits with a test key; the firmware only verifies.
ed25519-dalek = { version = "2.2", default-features = false }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
