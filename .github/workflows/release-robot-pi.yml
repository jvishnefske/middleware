name: Release robot Pi image

# MS55: on a tag `robot-pi-v<version>`, builds the Raspberry Pi robot SD
# image (nix, `.#packages.aarch64-linux.sd-image-robot-pi`, Pi Zero 2 W and
# Pi 3) natively on an arm runner, checks its contents
# (`checks.aarch64-linux.robot-pi-image`) and attaches it to that tag's
# release as `mw-robot-pi-<tag>.img.zst` with its `.sha256`.
#
# Kept apart from `release.yml` (the esp-base firmware and its Pages
# mirror): the image is large and slow to build, and a broken image build
# must never hold back a firmware release. A manual run (workflow_dispatch)
# builds and checks the image and keeps it as a workflow artifact without
# publishing anything.

on:
  push:
    tags: [ "robot-pi-v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-robot-pi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sd-image:
    name: Raspberry Pi SD image (aarch64, nix)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the image and check its contents
        run: |
          nix build -L --out-link sd \
            .#packages.aarch64-linux.sd-image-robot-pi
          nix build -L --no-link .#checks.aarch64-linux.robot-pi-image
      - name: Name and checksum
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          name="mw-robot-pi-${REF_NAME//\//-}.img.zst"
          mkdir out
          cp sd/sd-image/*.img.zst "out/$name"
          (cd out && sha256sum "$name" | tee "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: sd-image
          path: out/
          if-no-files-found: error
          compression-level: 0

  release:
    name: Attach the SD image to the release
    if: startsWith(github.ref, 'refs/tags/robot-pi-v')
    needs: [ sd-image ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sd-image
          path: sd-image
      - name: Create the release if needed and upload the image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "robot Pi image ${TAG#robot-pi-v}" \
              --notes "Raspberry Pi Zero 2 W / Pi 3 robot SD image. See README, \"Raspberry Pi robot image\"."
          gh release upload "$TAG" sd-image/*.img.zst sd-image/*.img.zst.sha256 --clobber
