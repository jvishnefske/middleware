[package]
name = "wasm-host"
version = "0.1.0"
edition = "2024"
description = "WASM payload runtime implementing the middleware payload ABI (no_std + alloc)"

[dependencies]
middleware = { path = ".." }
# `validate`: the safe `Module::new`. `portable-dispatch`: the loop-based
# dispatcher on every target and opt level. The tail-call dispatcher relies on
# sibling-call optimisation; without it (debug builds, Xtensa) each executed
# instruction nests a stack frame and a guest loop running down its fuel
# overflows the native stack (seen on the conagotchi badge, xtensa). See the
# crate docs, "Interpreter build".
wasmi = { version = "2.0", default-features = false, features = ["validate", "portable-dispatch"] }

[dev-dependencies]
wat = "1"
