[package]
name = "mwctl"
version = "0.1.0"
edition = "2024"
description = "Host CLI for the ESP base firmware's serial protocol: info, payload upload, start/stop, monitor, reset"
license = "MIT OR Apache-2.0"

[dependencies]
middleware = { path = "../.." }
# No `libudev`: mwctl opens the one port it is given and never enumerates.
serialport = { version = "4.10", default-features = false }
# Payload signing (host only): the image SHA-256 and Ed25519 signatures.
sha2 = "0.10.9"
ed25519-dalek = "2.2"
