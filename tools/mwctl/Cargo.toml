[package]
name = "mwctl"
version = "26.11.21"
edition = "2024"
description = "Host CLI for the ESP base firmware's serial protocol: info, payload upload, start/stop, monitor, reset"
license = "MIT OR Apache-2.0"

[dependencies]
middleware = { path = "../.." }
# The Colorlight 5A-75B takes a compiled image: mwctl compiles the module
# with the gateware's reference model (no_std, no other dependencies).
wasm-hdl-ref = { path = "../../wasm-hdl-ref" }
# No `libudev`: mwctl opens the one port it is given and never enumerates.
serialport = { version = "4.10", default-features = false }
# Payload signing (host only): the image SHA-256, Ed25519 signatures, and
# P-256 (ECDSA) for keys in hardware tokens.
sha2 = "0.10.9"
ed25519-dalek = "2.2"
p256 = { version = "0.13", features = ["ecdsa"] }
# PKCS#11 tokens (TPM 2.0 via tpm2-pkcs11, smart cards via OpenSC, SoftHSM2
# in tests): the module is dlopen()ed at run time, nothing links at build.
cryptoki = "0.10"

[features]
# `--zenoh` / `--zenoh-listen`: the device over a Zenoh session (the RT1050
# base firmware's Ethernet link). Off by default: it pulls in zenoh and
# tokio, and the default mwctl stays free of cloud crates
# (scripts/check-features.sh).
zenoh = ["middleware/zenoh", "dep:tokio", "dep:zenoh", "dep:serde_json"]

# `auth`: sign in to an OpenID Connect provider (MW_AUTH_ISSUER) and hand out
# bearer tokens, for the admin server's certificate enrolment. Off by
# default for the same reason as `zenoh`: HTTPS pulls in rustls and tokio.
auth = ["dep:reqwest", "dep:serde_json"]

# HTTPS for `auth` (rustls, the platform's roots); no JSON or form features:
# mwctl encodes the form itself and parses with serde_json.
[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["blocking", "rustls"]
optional = true

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "time"]
optional = true

# `scout` (feature `zenoh`): multicast scouting and the routers' admin
# space need the zenoh session itself, and the admin space answers JSON.
[dependencies.zenoh]
version = "1.10"
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dev-dependencies]
# The fake device runs the real firmware updater on the in-memory RP2350
# bootrom model. Tests only: the shipped mwctl uses no middleware feature.
middleware = { path = "../..", features = ["fw-sim"] }
# ecp5::tests compiles payloads/templates/bridge.wat (1-byte pages).
wat = "1"
