[package]
name = "payload-sim"
version = "0.1.0"
edition = "2024"
description = "Desktop simulator for WASM payloads"

[dependencies]
# `cam-fixtures`: JPEG test-pattern sources serve the baked camera frames.
middleware = { path = "../..", features = ["cam-fixtures"] }
wasm-host = { path = "../../wasm-host" }

[dev-dependencies]
wat = "1"
# Reference decode for the R14 end-to-end test (tests/r14.rs), host-side.
mw-jpeg = { path = "../../payloads/jpeg" }
# Counting global allocator for the heap measurement (tests/heap.rs).
peak_alloc = "0.3"

# Measures heap use with a process-wide counting allocator, so it runs
# alone, without the libtest harness and its threads.
[[test]]
name = "heap"
harness = false
