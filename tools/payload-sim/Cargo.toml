[package]
name = "payload-sim"
version = "26.11.21"
edition = "2024"
description = "Desktop simulator for WASM payloads"

[dependencies]
# `cam-fixtures`: JPEG test-pattern sources serve the baked camera frames.
middleware = { path = "../..", features = ["cam-fixtures"] }
wasm-host = { path = "../../wasm-host", default-features = false }

[features]
default = ["wasmi"]
# The interpreter the simulated payloads run on (wasm-host's backends).
# `cargo test -p payload-sim --no-default-features --features micro` runs
# this crate's tests on the small one.
wasmi = ["wasm-host/wasmi"]
micro = ["wasm-host/micro-float"]

[dev-dependencies]
wat = "1"
# The S88 phase model, wire contract and engine for the phase server
# tests (tests/phase.rs).
recipe-core = { path = "../../recipe-core" }
# Reference decode for the R14 end-to-end test (tests/r14.rs), host-side.
mw-jpeg = { path = "../../payloads/jpeg" }
# Counting global allocator for the heap measurement (tests/heap.rs).
peak_alloc = "0.3"

# Measures heap use with a process-wide counting allocator, so it runs
# alone, without the libtest harness and its threads.
[[test]]
name = "heap"
harness = false
